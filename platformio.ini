[env:m5stickc-plus-readonly]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    m5stack/M5StickCPlus@0.1.1
    ricmoo/QRCode@0.0.1

; M4 physical-button clock-writing LAB BUILD. Not flashed automatically.
; The default read-only environment remains the qualified upload candidate.
[env:m5stickc-plus-write-lab]
extends = env:m5stickc-plus-readonly
build_flags = -DZK_ENABLE_M5_TIME_WRITE=1
