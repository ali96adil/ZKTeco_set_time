[platformio]
; Normal build/USB upload executes actual ZK clock writes after deliberate action.
default_envs = m5stickc-plus-production

[env:m5stickc-plus-readonly]
platform = espressif32@6.9.0
board = m5stick-c
; HTTPS adds code beyond the default 1.25 MiB OTA app slot.
; Original M5StickC Plus uses 4 MiB flash; USB-only huge_app (3 MiB) partition.
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    m5stack/M5StickCPlus@0.1.1
    ricmoo/QRCode@0.0.1
    esp32_https_server_compat@1.0.0
    https://github.com/stooged/esp32_https_server.git#87384ab81f580d0ff59c612cbd5d2a51f953c28e

[env:m5stickc-plus-production]
extends = env:m5stickc-plus-readonly
build_flags = -DZK_ENABLE_M5_TIME_WRITE=1

; Read-only remains as optional diagnostic / rollback build only.
; Production is the default and is fully writable via HTTPS + M5 buttons.

; Legacy lab name for backward compatibility, not default.
[env:m5stickc-plus-write-lab]
extends = env:m5stickc-plus-readonly
build_flags = -DZK_ENABLE_M5_TIME_WRITE=1

; Dedicated HTTPS test build. App compile verifies secure routes; never auto-upload.
[env:m5stickc-plus-secure-write-lab]
extends = env:m5stickc-plus-readonly
build_flags = -DZK_ENABLE_M5_TIME_WRITE=1
